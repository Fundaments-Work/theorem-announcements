name: Sync Announcements to KV

# Worker deploys are handled by Cloudflare's GitHub integration (auto-deploy
# on push), not here. This workflow only validates and syncs the data file —
# deploying ships code, but only `kv key put` updates the live feed.
on:
  push:
    branches: [main]
    paths:
      - "announcements.json"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate & Test
        run: |
          pnpm typecheck
          pnpm test

      - name: Sync announcements.json to KV
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --remote is load-bearing: without it wrangler writes to the runner's
          # local storage and the step "succeeds" while remote KV keeps the old
          # value indefinitely (this silently broke the 2026-10-11 takedown).
          command: kv key put announcements "$(cat announcements.json)" --binding ANNOUNCEMENTS_KV --preview false --remote
